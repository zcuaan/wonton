
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coccinelle | Staff Supervision</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f8f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #173f34;
    }

    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .brand {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #27604d;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 30px;
    }

    .card {
      display: block;
      background: white;
      border: 1px solid #d6e3da;
      border-radius: 18px;
      padding: 30px 20px;
      margin-bottom: 18px;
      text-decoration: none;
      color: #173f34;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
      transition: 0.2s;
    }

    .card:hover {
      border-color: #27604d;
      transform: translateY(-2px);
    }

    .icon {
      font-size: 36px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 21px;
      margin: 0 0 8px;
    }

    .frequency {
      font-size: 14px;
      color: #64766b;
      margin-bottom: 20px;
    }

    .button {
      display: block;
      background: #27604d;
      color: white;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">COCCINELLE DAY NURSERY</div>
    <h1>Staff Supervision</h1>

    <a class="card" href="2m.html">
      <div class="icon">📋</div>
      <h2>Routine Supervision</h2>
      <div class="frequency">Every 6–8 weeks</div>
      <span class="button">Open Form</span>
    </a>

    <a class="card" href="coccinelle-termly-review.html">
      <div class="icon">🎓</div>
      <h2>Termly Review</h2>
      <div class="frequency">Once per term</div>
      <span class="button">Open Form</span>
    </a>
  </main>
</body>
</html>
